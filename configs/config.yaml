# K8s Analyzer Agent 配置文件

# agent-kubectl-gateway 连接配置
gateway:
  base_url: "${GATEWAY_BASE_URL}"
  auth_token: "${GATEWAY_AUTH_TOKEN}"
  timeout_seconds: 30

# shell-executor-mcp 连接配置
shell_mcp:
  server_url: "${SHELL_MCP_URL}"
  transport: "sse"
  auth_token: "${SHELL_MCP_TOKEN}"

# LLM 配置
llm:
  light:
    provider: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENAI_API_KEY}"
    model: "minimax/minimax-m2.5"
    temperature: 0.1
    max_tokens: 128000
  power:
    provider: "openrouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENAI_API_KEY}"
    model: "openai/gpt-5.4-nano"
    temperature: 0.3
    max_tokens: 128000

# Store 配置
store:
  type: "memory"
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0

# Agent 行为配置
agent:
  max_iterations: 20
  compress_threshold: 4
  output_max_lines: 100
  output_max_chars: 6000
  finding_ttl_hours: 1
  verify_recommendations: true  # 是否启用验证迭代
  max_verify_iterations: 2      # 验证阶段最大迭代数
  max_namespaces: 0             # 0=动态计算，>0=固定上限
  tool_cache:
    backend: "memory"           # 可选 "memory" | "redis" | "file"
    ttl: "10m"                  # 缓存过期时间
    file_dir: ""                # backend=file 时的缓存目录

# 监控与 Trace 配置
monitor:
  api_port: 9090
  trace_dir: "data/traces"

# Skill 中间件配置
skill:
  enabled: true
  dir: "./skills"

# 日志配置
log:
  level: "info"
  file_path: "logs/app.log"
  max_size_mb: 100
  max_backups: 3
