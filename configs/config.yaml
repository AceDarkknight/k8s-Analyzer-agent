# K8s Analyzer Agent 配置文件

# agent-kubectl-gateway 连接配置
gateway:
  base_url: "${GATEWAY_BASE_URL}"
  auth_token: "${GATEWAY_AUTH_TOKEN}"
  timeout_seconds: 30

# shell-executor-mcp 连接配置
shell_mcp:
  server_url: "${SHELL_MCP_URL}"
  transport: "sse"
  auth_token: "${SHELL_MCP_TOKEN}"

# LLM 配置
llm:
  light:
    provider: "openai"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENAI_API_KEY}"
    model: "nvidia/nemotron-3-super-120b-a12b:free"
    temperature: 0.1
    max_tokens: 1000
  power:
    provider: "openai"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENAI_API_KEY}"
    model: "openai/gpt-5.4-nano"
    temperature: 0.3
    max_tokens: 4000

# Store 配置
store:
  type: "memory"
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 0

# Agent 行为配置
agent:
  max_iterations: 10
  compress_threshold: 4
  output_max_lines: 50
  output_max_chars: 3000
  finding_ttl_hours: 1
  verify_recommendations: true    # 是否自动执行可验证建议
  max_verify_commands: 3          # 每次最多验证几条建议命令
  verify_full_regeneration: true  # 有新信息时是否完整重新生成终版报告（false=仅结构化补充）

# 日志配置
log:
  level: "info"
  file_path: "logs/app.log"
  max_size_mb: 100
  max_backups: 3
