# Safety Agent 安全审计规则

whitelist:
  # 这些命令总是安全的，跳过 LLM 审计（前缀匹配）
  commands:
    - "cat"
    - "head"
    - "tail"
    - "grep"
    - "awk"
    - "wc"
    - "df"
    - "du"
    - "free"
    - "uptime"
    - "top -bn1"
    - "ps aux"
    - "netstat"
    - "ss"
    - "ip addr"
    - "ip route"
    - "ping"
    - "traceroute"
    - "dig"
    - "nslookup"
    - "curl -I"
    - "crictl ps"
    - "crictl logs"
    - "docker ps"
    - "docker logs"
    - "dmesg"
    - "journalctl"
    - "vmstat"
    - "iostat"

blacklist:
  # 这些模式总是被拒绝，不进入 LLM 审计（正则匹配）
  patterns:
    - "rm\\s+-rf"
    - "rm\\s+-r"
    - "mkfs"
    - "dd\\s+if="
    - "shutdown"
    - "reboot"
    - "init\\s+[0-6]"
    - "chmod\\s+777"
    - "chown\\s+-R"
    - "iptables\\s+-F"
    - "systemctl\\s+stop"
    - "systemctl\\s+disable"
    - "kill\\s+-9"
    - "pkill"
    - ">\\s*/dev/"
    - "curl.*\\|.*sh"
    - "wget.*\\|.*sh"
    - "eval"
    - "exec"
    - "\\$\\("
    - "`"
    - "\\|\\s*bash"
    - "\\|\\s*sh"
